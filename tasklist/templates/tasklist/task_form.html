{% extends "base.html" %}
{% block content %}

<div class="container mt-3">
    <div class="d-flex justify-content-between align-items-center py-3"></div>
        <h1>New Task</h1>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn btn-primary mb-3">
            Save
            </button>

            <a href="{% url 'tasklist' %}" class="btn btn-outline-primary mb-3">
            Cancel
            </a>

        </form>
    </div>
</div>
{% endblock %}
