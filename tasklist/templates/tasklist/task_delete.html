{% extends "base.html" %}

{% block title %}
Delete Task
{% endblock %}

{% block content %}

<div class="container mt-3">
    <div class="d-flex justify-content-between align-items-center py-3"></div>

<h2>Delete Task</h2>

<p>
    Are you sure you want to delete this task?
</p>

<form method="post">
    {% csrf_token %}

    <button type="submit" class="btn btn-danger">
    Delete
    </button>

    <a href="{% url 'tasklist' %}" class="btn btn-secondary">
    Back
    </a>
</form>

{% endblock %}
